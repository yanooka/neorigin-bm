                支持微信或手机浏览器直接扫码访问
            </p>


            <button onclick="closeQr()"
                    class="w-full mt-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium transition-colors">

                关闭

            </button>

        </div>

    </div>


    <!-- =========================================================
         Notification Toast
         ========================================================= -->
    <div id="toast"
         class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden">

        <div class="bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center space-x-2">

            <i class="fa-solid fa-circle-check text-emerald-400"></i>

            <span id="toastMsg">
                已成功复制链接
            </span>

        </div>

    </div>


    <!-- =========================================================
         Footer
         ========================================================= -->
    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200/60 mt-6 flex items-center justify-center space-x-1">

        <i class="fa-regular fa-shield-check text-slate-400"></i>

        <span>
            © 2024 项目管理系统 · 让项目管理更高效
        </span>

    </footer>


    <!-- =========================================================
         JavaScript
         ========================================================= -->
    <script>

        // Smooth scroll function
        function scrollToSection(id) {

            const el = document.getElementById(id);

            if (el) {

                el.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });

            }

        }


        // Copy link logic
        function copyUrl(text) {

            if (navigator.clipboard && window.isSecureContext) {

                navigator.clipboard.writeText(text)
                    .then(() => showToast("已复制表单链接"));

            } else {

                const area = document.createElement("textarea");

                area.value = text;

                area.style.position = "fixed";
                area.style.left = "-9999px";

                document.body.appendChild(area);

                area.select();

                try {

                    document.execCommand('copy');

                    showToast("已复制表单链接");

                } catch (e) {

                    showToast("复制失败");

                }

                document.body.removeChild(area);

            }

        }


        // Toast notification
        function showToast(msg) {

            const toast = document.getElementById('toast');

            document.getElementById('toastMsg').innerText = msg;

            toast.classList.remove('hidden');

            toast.classList.add('toast-show');

            setTimeout(() => {

                toast.classList.add('hidden');

                toast.classList.remove('toast-show');

            }, 2000);

        }


        // QR Code Modal
        function openQr(title, url) {

            document.getElementById('modalTitle').innerText = title;

            const container = document.getElementById('qrcode');

            container.innerHTML = '';

            new QRCode(container, {

                text: url,

                width: 140,

                height: 140,

                colorDark: "#1e293b",

                colorLight: "#ffffff",

                correctLevel: QRCode.CorrectLevel.M

            });

            const modal = document.getElementById('qrModal');

            modal.classList.remove(
                'opacity-0',
                'pointer-events-none'
            );

        }


        // Close QR Code Modal
        function closeQr() {

            const modal = document.getElementById('qrModal');

            modal.classList.add(
                'opacity-0',
                'pointer-events-none'
            );

        }


        // Click outside modal to close
        document.getElementById('qrModal')
            .addEventListener('click', function(e) {

                if (e.target === this) {

                    closeQr();

                }

            });

    </script>

</body>
</html>
